      <div id="c3-out-h" class="c3-h" data-hold>What Angular does not protect you from</div>
      <div id="c3-o1" class="c3-out"><p><b>Route guards and hidden buttons are user experience, not authorization.</b> Anyone can call the API without the UI. The server decides who may read or change what; a <code>canActivate</code> only decides what the app shows.</p></div>
      <div id="c3-o2" class="c3-out"><p><b>Never build templates from user input.</b> Compiling a template string at runtime that includes user data lets that data run as Angular template code, and the sanitizer cannot help, because the attacker wrote the template. This is the first rule in the Angular security guide.</p></div>
      <div id="c3-o34" class="c3-out">

        <p id="c3-o4"><b>Third-party scripts and dependencies run with the page's full privileges.</b> An analytics snippet or a compromised package can read the DOM, tokens in storage and every request. The sanitizer does nothing for code you included on purpose; review new dependencies and scripts like code your team wrote, and use a CSP to limit where scripts come from.</p>
      </div>
      <div id="c3-o5" class="c3-out" data-hold><p><b>Server rendering can put private data into the HTML.</b> The HTTP transfer cache serializes server responses into the page. By default it skips requests with auth headers or credentials; options such as <code>includeRequestsWithAuthHeaders</code> turn that off and write those responses into the page source. <code>security.allowedHosts</code> protects the server from forged hostnames; it does not decide what the page contains.</p></div>
