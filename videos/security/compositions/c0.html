      <div id="c0-f-head" data-hold>For a security finding, three factors decide the label, and you should be able to say all three in the comment:</div>
      <div id="c0-f-list" data-hold>
        <div id="c0-f1" class="c0-row"><span>1.</span><span><b>What the attacker gains.</b> Running code in someone else's session, reading a credential, changing data as someone else, or sending a user somewhere they did not mean to go are serious. Learning a version number is not.</span></div>
        <div id="c0-f2" class="c0-row"><span>2.</span><span><b>Who can trigger it, against whom.</b> Any anonymous visitor against every user is the worst case. A signed-in member against other members is close behind. Something only the victim can do to themselves, or only an administrator can do, is much narrower.</span></div>

      <div id="c0-ex-head">Two worked examples from a feature that is not in the exercises, the member's profile page:</div>
      <div id="c0-ex-list" data-hold>
        <div id="c0-ex1" class="c0-ex"><div>A member can put markup in their own "favourite quote" field, and it runs only on their own private settings page. The only person who can trigger it is the victim, against themselves (self-XSS). It is a real bug and worth fixing, usually a <b>should-fix</b>, rarely blocking. It moves up the moment that field is shown to anyone else, or if another bug lets an attacker write to it.</div><span class="c0-chip">should-fix</span></div>

    <!-- c0-9 to c0-12: what moved since Angular 17 (LESSON.md table), cut in whole, one row banded at a time -->
    <div id="c0-moved" class="clip world" data-start="90.27" data-duration="38.88">
      <div class="c0-h">What moved since Angular 17</div>
      <div id="c0-mv-chips"><span id="c0-ch-a" class="c0-chip">angular</span><span id="c0-ch-b" class="c0-chip">angular#unsafe-bypass</span></div>
      <div id="c0-mv-head" class="c0-table"><div class="c0-tr c0-th"><div>Area</div><div>Angular 17</div><div>Angular 22.2.2 (verified in the installed package)</div></div></div>
      <div id="c0-mv-win" data-layout-allow-overflow>
        <div id="c0-mv-table" class="c0-prose" data-hold>
          <div id="c0-m1" class="c0-tr"><div>HTTP setup</div><div><code>provideHttpClient(...features)</code> already existed next to <code>HttpClientModule</code>.</div><div><code>provideHttpClient(...)</code> with functional interceptors (<code>withInterceptors([fn])</code>) is the norm. XSRF protection is on by default, as it was in 17; <code>withXsrfConfiguration({ cookieName, headerName })</code> renames it, <code>withNoXsrfProtection()</code> turns it off.</div></div>
          <div id="c0-m2" class="c0-tr"><div>HTTP backend</div><div><code>XMLHttpRequest</code>.</div><div><code>fetch</code> by default, and request options accept fetch's <code>credentials</code>, <code>referrer</code> and <code>referrerPolicy</code> next to the older <code>withCredentials</code>.</div></div>
          <div id="c0-m3" class="c0-tr"><div><code>DOCUMENT</code></div><div>Only from <code>@angular/common</code>.</div><div>Exported from <code>@angular/core</code>, re-exported from <code>@angular/common</code>.</div></div>
          <div id="c0-m4" class="c0-tr"><div>URL sanitizer</div><div>Rewrites unsafe URLs to <code>unsafe:...</code>.</div><div>Rewrites a <code>javascript:</code> URL to <code>unsafe:javascript:...</code> and warns in dev mode.</div></div>
          <div id="c0-m5" class="c0-tr"><div>Trusted Types</div><div>Supported.</div><div>When the browser supports them, Angular creates two policies: <code>angular</code> for its own sanitized values and <code class="c0-nw">angular#unsafe-bypass</code> for <code>bypassSecurityTrust*</code> HTML, script and resource URL values (style and URL bypasses get no policy). A CSP can allow the first and refuse the second.</div></div>
          <div id="c0-m6" class="c0-tr"><div>CSP</div><div><code>CSP_NONCE</code> token or <code>ngCspNonce</code> attribute (v16+).</div><div>Same, plus an experimental <code>security.autoCsp</code> option in the application builder that generates a hash-based strict CSP for <code>index.html</code> (default <code>false</code>).</div></div>
          <div id="c0-m7" class="c0-tr"><div>SSR</div><div><code>@angular/ssr</code> was new.</div><div>The builder's <code>security.allowedHosts</code> limits which hostnames the server application accepts.</div></div>
        </div>
      </div>
    </div>

        <div class="c0-tr c0-th"><div>Context</div><div>Bindings that use it</div><div>What Angular does</div></div>
        <div id="c0-x1" class="c0-tr"><div><code>HTML</code></div><div><code>[innerHTML]</code>, <code>[outerHTML]</code>, <code>iframe[srcdoc]</code></div><div>Keeps a safe subset of elements and attributes; drops scripts and event handler attributes.</div></div>
        <div id="c0-x2" class="c0-tr"><div><code>URL</code></div><div><code>a[href]</code>, <code>area[href]</code>, <code>form[action]</code>, <code>[formAction]</code></div><div>Leaves ordinary URLs alone, neutralizes <code>javascript:</code>.</div></div>
        <div id="c0-x3" class="c0-tr"><div><code>RESOURCE_URL</code></div><div><code>iframe[src]</code>, <code>embed[src]</code>, <code>object[data]</code>, <code>link[href]</code>, <code>base[href]</code></div><div>Refuses anything not explicitly trusted, because the browser loads and runs what these point at.</div></div>
        <div id="c0-x4" class="c0-tr"><div><code>ATTRIBUTE_NO_BINDING</code></div><div><code>iframe</code> <code>sandbox</code>, <code>allow</code>, <code>allowFullscreen</code>, <code>referrerPolicy</code>, <code>csp</code>, <code>credentialless</code>, <code>fetchPriority</code>; SVG <code>animate</code>/<code>set</code> <code>attributeName</code>, <code>values</code>, <code>to</code>, <code>from</code></div><div>Refuses a binding at all. These attributes change what the element is allowed to do, so they must be static in the template.</div></div>
