    <!-- c2-16, c2-17, c2-18: what the cache answers and what it skips (LESSON.md list) -->
    <div id="c2-cache" class="clip world" data-start="139.53" data-duration="25.46">
      <div class="c2-h" style="top: 64px">The HTTP transfer cache</div>
      <div class="c2-list" data-hold>
        <div id="c2-c1" class="c2-row">It answers only until the browser app first becomes stable. A request made after that (from a timer, after a click, from code that waits for something) goes to the network, even if the server made the same request.</div>
        <div id="c2-c2" class="c2-row">It caches <code>GET</code> and <code>HEAD</code>; <code>POST</code> only with <code>includePostRequests: true</code>.</div>
        <div id="c2-c3" class="c2-row">It skips requests with <code>Authorization</code>, <code>Proxy-Authorization</code> or <code>Cookie</code> headers, unless <code>includeRequestsWithAuthHeaders</code> is set.</div>
        <div id="c2-c4" class="c2-row">It skips requests sent with credentials (<code>withCredentials</code>, or fetch <code>credentials</code> of <code>'include'</code> or <code>'same-origin'</code>), unless <code>includeRequestsWithCredentials</code> is set.</div>
        <div id="c2-c5" class="c2-row">It skips requests whose <code>Cache-Control</code> header says <code>no-store</code>, <code>private</code> or <code>no-cache</code>, or whose fetch <code>cache</code> option is <code>no-cache</code> or <code>no-store</code>, unless <code>includeNonCacheableRequests</code> is set.</div>
        <div id="c2-c6" class="c2-row">A request can opt out with its own <code>transferCache: false</code> option, and <code>withHttpTransferCacheOptions({ filter })</code> can exclude more.</div>
        <div id="c2-cache-close" class="c2-row">Opting in to the authenticated cases writes those responses into the page source, which matters if pages are cached.</div>
      </div>
    </div>
