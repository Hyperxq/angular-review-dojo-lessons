      <div class="c0-h">Why render on the server, and when not to</div>
      <div id="c0-why-lists" data-hold>
        <div class="c0-sub">What SSR buys:</div>
        <div id="c0-b1" class="c0-li">A faster first meaningful paint (First Contentful Paint, Largest Contentful Paint) on slow devices and networks, because the browser can show HTML before the JavaScript has downloaded and run.</div>
        <div id="c0-b2" class="c0-li">Content for crawlers and link previews that do not run JavaScript.</div>
        <div id="c0-costs-sub" class="c0-sub">What it costs:</div>
        <div id="c0-k1" class="c0-li">A Node runtime that renders on every request: server CPU, a longer Time to First Byte when rendering is slow, and the work of caching rendered pages at a CDN.</div>
        <div id="c0-k2" class="c0-li">Code that has to run correctly in two environments (chapter 1).</div>
        <div id="c0-k3" class="c0-li">Hydration still downloads and runs the app's JavaScript. That work can still hurt Total Blocking Time and Interaction to Next Paint, and incremental hydration (chapter 3) exists to reduce it.</div>
      </div>
    </div>
