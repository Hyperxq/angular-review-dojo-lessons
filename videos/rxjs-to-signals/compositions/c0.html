    <audio id="c0-tick4" class="clip" src="assets/sfx/tick-b.wav" data-start="55.12" data-duration="0.3" data-volume="0.25"></audio>
    <audio id="c0-tick5" class="clip" src="assets/sfx/tick-a.wav" data-start="55.48" data-duration="0.3" data-volume="0.25"></audio>
    <audio id="c0-tick6" class="clip" src="assets/sfx/tick-b.wav" data-start="56.02" data-duration="0.3" data-volume="0.25"></audio>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const fadeIn = (sel, at, d = 0.5) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d, ease: "power3.out" }, at);
    const print = (sel, at) =>
      tl.fromTo(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.27, ease: "power3.out" }, at);
    const pulse = (sel, at) => {
      tl.fromTo(sel, { scale: 1 }, { scale: 1.12, duration: 0.15, ease: "power2.out" }, at);
      tl.to(sel, { scale: 1, duration: 0.15, ease: "power2.in" }, at + 0.15);
    };
    const tint = (sel, from, to, at, d = 0.3) => tl.fromTo(sel, { backgroundColor: from }, { backgroundColor: to, duration: d }, at);
    const draw = (sel, at, d = 0.6) => {
      tl.fromTo(sel + " .c0-ep", { strokeDashoffset: (i, el) => el.getAttribute("stroke-dasharray") }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, at);
      tl.fromTo(sel + " .c0-eh", { opacity: 0 }, { opacity: 1, duration: 0.15 }, at + d - 0.1);
    };

    // chapter card: fully on screen from frame 0

    // c0-1: two worlds, then the border between them
    ["#c0-nav1", "#c0-nav2", "#c0-nav3", "#c0-nav4"].forEach((n, i) => fadeIn(n, 3.2 + i * 0.2, 0.4));
    fadeIn("#c0-head", 4.0, 0.6);
    fadeIn("#c0-pa", 7.6);
    fadeIn("#c0-pb", 7.75);
    fadeIn("#c0-tag-a", 9.1, 0.4);
    fadeIn("#c0-tag-b", 10.1, 0.4);
    tl.fromTo("#c0-border", { scaleY: 0, transformOrigin: "top center" }, { scaleY: 1, duration: 0.8, ease: "power2.inOut" }, 12.3);

    // c0-2a: zone.js struck on "zoneless"
    tl.fromTo("#c0-zone-strike", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.4, ease: "power2.inOut" }, 14.9);
    fadeIn("#c0-zone-note", 15.25, 0.4);

    // c0-2b: each input lights the lamp as it is named
    [17.6, 20.6, 22.5, 24.7].forEach((t, i) => {
      const w = "#c0-w" + (i + 1);
      fadeIn(w + " .c0-wire-text", t - 0.4, 0.4);
      tl.fromTo(w + " .c0-wire-glow", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, t - 0.2);
    });
    tl.fromTo("#c0-bulb-on", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 17.9);
    tl.to("#c0-bulb-on", { keyframes: [
      { opacity: 0.3, duration: 0.6, delay: 0.7 }, { opacity: 1, duration: 0.2, delay: 1.5 },
      { opacity: 0.3, duration: 0.6, delay: 0.7 }, { opacity: 1, duration: 0.2, delay: 0.4 },
      { opacity: 0.3, duration: 0.6, delay: 0.7 }, { opacity: 1, duration: 0.2, delay: 0.7 },
    ] }, 18.1);

    // c0-3a: OnPush is the default, the old behaviour is Eager
    fadeIn("#c0-cd1", 26.2);
    fadeIn("#c0-cd1n", 28.0, 0.4);
    fadeIn("#c0-cd2", 29.4);
    fadeIn("#c0-cd2n", 29.6, 0.4);
    fadeIn("#c0-cd3", 30.2, 0.4);
    fadeIn("#c0-cd3n", 30.35, 0.4);
    tl.fromTo("#c0-eager-band", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 30.9);

    // c0-3b: input, event, signal light one node each
    fadeIn("#c0-n0", 31.95, 0.4);
    fadeIn("#c0-edges", 32.1, 0.4);
    ["#c0-n1", "#c0-n2", "#c0-n3"].forEach((n, i) => fadeIn(n, 32.2 + i * 0.12, 0.4));
    [[34.5, 1], [35.8, 2], [37.0, 3]].forEach(([t, k]) => {
      tl.fromTo("#c0-r" + k, { opacity: 0 }, { opacity: 1, duration: 0.2 }, t);
      fadeIn("#c0-t" + k, t + 0.1, 0.4);
      if (k < 3) tl.to("#c0-r" + k, { opacity: 0, duration: 0.2 }, t + 1.1);
    });

    // c0-4: rows top to bottom as the APIs are named, band on the interop row
    fadeIn("#c0-tbl-title", 37.95, 0.5);
    fadeIn("#c0-tbl .c0-th", 38.3, 0.4);
    [38.7, 40.4, 40.9, 41.4, 41.9, 42.5].forEach((t, i) => fadeIn("#c0-tr" + (i + 1), t, 0.4));
    tl.fromTo("#c0-tr5-band", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 46.6);

    // c0-5: the value now, then events printed over time (0.18 s per frame from 53.5)
    fadeIn("#c0-sig", 48.6);
    fadeIn("#c0-sig-val", 51.9, 0.4);
    fadeIn("#c0-ev-l", 53.2, 0.4);
    fadeIn("#c0-ev-t", 53.2, 0.4);
    [1, 3, 6, 9, 11, 14].forEach((f, i) => print("#c0-m" + (i + 1), 53.5 + f * 0.18));
    fadeIn("#c0-ev-n", 56.4, 0.4);

    // c0-6: one keystroke goes into the signal box
    tint("#c0-m5", "#1d1b18", "#b8321f", 59.6);
    pulse("#c0-m5", 59.9);
    tl.fromTo("#c0-m5", { x: 0, y: 0 }, { x: -200, y: -262, duration: 0.8, ease: "power2.inOut" }, 61.4);
    tl.to("#c0-sig-val", { opacity: 0.3, duration: 0.4, ease: "power2.in" }, 62.0);

    // c0-7: boxes cut in; arrows draw when their step is named
    ["#c0-fa", "#c0-fb", "#c0-fc", "#c0-fd", "#c0-fe", "#c0-ff"].forEach((b, i) => fadeIn(b, 64.9 + i * 0.1, 0.4));
    draw("#c0-e1", 65.6);
    draw("#c0-e5", 67.7, 0.7);
    draw("#c0-e6", 68.4, 0.7);
    draw("#c0-e2", 70.2);
    draw("#c0-e3", 70.6);
    draw("#c0-e4", 72.5);

    // c0-8a: the injection context, then its three places
    fadeIn("#c0-note", 73.9);
    tint("#c0-hl1", "rgba(245,226,217,0)", "rgba(245,226,217,1)", 77.6);
    ["#c0-p1", "#c0-p2", "#c0-p3"].forEach((p, i) => fadeIn(p, 78.1 + i * 0.4, 0.4));

    // c0-8b: the band moves to the later-use sentence
    tl.to("#c0-hl1", { backgroundColor: "rgba(245,226,217,0)", duration: 0.3 }, 82.4);
    tint("#c0-hl2", "rgba(245,226,217,0)", "rgba(245,226,217,1)", 82.5);
    tl.to(["#c0-p1", "#c0-p2", "#c0-p3"], { opacity: 0.4, duration: 0.4 }, 82.5);

    // c0-9: subscribed at once, held until destroyed; a root service holds it all session
    fadeIn("#c0-warn", 87.4);
    ["#c0-ty1", "#c0-ty2", "#c0-ty3", "#c0-ty3n"].forEach((t, i) => fadeIn(t, 88.4 + i * 0.3, 0.4));
    tl.fromTo("#c0-comp-bar", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.8, ease: "power2.inOut" }, 91.4);
    fadeIn("#c0-end", 92.2, 0.2);
    fadeIn("#c0-end-l", 92.35, 0.4);
    tl.fromTo("#c0-root-bar", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 1.0, ease: "power2.inOut" }, 94.2);
    fadeIn("#c0-root-l", 95.4, 0.4);

    window.__timelines["c0"] = tl;
  </script>
</template>
