    <!-- one tick per printed frame of the diagram (marbles on the same frame share one) -->
    <audio id="c3-tick1" class="clip" src="assets/sfx/tick-a.wav" data-start="50" data-duration="0.3" data-volume="0.25"></audio>
    <audio id="c3-tick2" class="clip" src="assets/sfx/tick-b.wav" data-start="50.9" data-duration="0.3" data-volume="0.25"></audio>
    <audio id="c3-tick3" class="clip" src="assets/sfx/tick-a.wav" data-start="51.62" data-duration="0.3" data-volume="0.25"></audio>
    <audio id="c3-tick4" class="clip" src="assets/sfx/tick-b.wav" data-start="52.7" data-duration="0.3" data-volume="0.25"></audio>
    <audio id="c3-tick5" class="clip" src="assets/sfx/tick-a.wav" data-start="53.24" data-duration="0.3" data-volume="0.25"></audio>
    <audio id="c3-tick6" class="clip" src="assets/sfx/tick-b.wav" data-start="54.5" data-duration="0.3" data-volume="0.25"></audio>
    <audio id="c3-tick7" class="clip" src="assets/sfx/tick-a.wav" data-start="54.86" data-duration="0.3" data-volume="0.25"></audio>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const enter = { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" };
    const fade = (sel, at, d = 0.5) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d, ease: "power3.out" }, at);
    const out = (sel, at) => tl.to(sel, { opacity: 0, duration: 0.4, ease: "power2.in" }, at);
    const print = (sel, at) =>
      tl.fromTo(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.27, ease: "power3.out" }, at);
    const pulse = (sel, at) =>
      tl.fromTo(sel, { scale: 1 }, { scale: 1.12, duration: 0.2, ease: "power2.inOut", yoyo: true, repeat: 1 }, at);
    const band = (sel, at) => tl.fromTo(sel, { backgroundColor: "rgba(245,226,217,0)" }, { backgroundColor: "rgba(245,226,217,1)", duration: 0.3 }, at);
    const draw = (sel, at) =>
      tl.fromTo(sel, { strokeDasharray: 400, strokeDashoffset: 400, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: 0.6, ease: "power2.inOut" }, at);

    // chapter card: on screen from frame 0, no entrance

    // c3-1: pick a member, the year, then the history loads
    fade("#c3-filters", 3.3);
    fade("#c3-desk .c3-panel", 3.45);
    tl.to("#c3-pick-none", { opacity: 0, duration: 0.2 }, 5.1);
    tl.to("#c3-pick-a", { opacity: 1, duration: 0.2 }, 5.1);
    tl.fromTo("#c3-year", { borderColor: "#c4b9a6" }, { borderColor: "#1d1b18", duration: 0.3 }, 6.6);
    tl.fromTo(".c3-r1", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power3.out", stagger: 0.2 }, 7.7);

    // c3-2: each moment lands as the narration names it
    tl.fromTo("#c3-time", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power2.inOut" }, 10.4);
    [["#c3-k1", "#c3-t1", 12.4], ["#c3-k2", "#c3-t2", 13.4], ["#c3-k3", "#c3-t3", 14.4], ["#c3-k4", "#c3-t4", 15.1], ["#c3-k5", "#c3-t5", 16.0]].forEach(([k, t, at]) => {
      print(k, at);
      fade(t, at + 0.1);
    });

    // c3-3: fields, then their combinations, then they collapse into one resource
    fade("#c3-gh", 19.0);
    tl.fromTo(".c3-combo", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power3.out", stagger: 0.28 }, 21.0);
    tl.to("#c3-grid", { scale: 0.2, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 23.9);
    tl.fromTo("#c3-res", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 24.3);
    fade("#c3-derived", 26.0);

    // c3-4a: the old route subscription struck, then the router binding
    fade("#c3-old", 28.0, 0.4);
    tl.fromTo("#c3-old-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 31.3);
    fade("#c3-bind", 33.2);

    // c3-4b: ShelfPage; a missing key writes undefined; the band on the transform
    tl.set(["#c3-old", "#c3-bind"], { opacity: 0 }, 34.82);
    tl.fromTo("#c3-shelf", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 34.82);
    fade("#c3-undef", 38.6);
    band("#c3-tf", 40.3);

    // c3-5: band on params; the resource is idle
    fade("#c3-loan", 42.85, 0.3);
    band(".c3-params", 43.4);
    fade("#c3-idle", 47.2);

    // c3-6: the diagram prints left to right, 0.18 s per frame
    document.querySelectorAll("#c3-dia .m, #c3-dia .m-done, #c3-dia .m-err").forEach((el) =>
      print(el, 50.0 + parseFloat(el.style.getPropertyValue("--f")) * 0.18));

    // c3-7: the status row is the one value; the warning about value() in the error state
    tl.to("#c3-st-l", { color: "#b8321f", duration: 0.3 }, 58.3);
    tl.to(".c3-st", { backgroundColor: "#b8321f", duration: 0.3 }, 58.3);
    tl.fromTo("#c3-warn", { opacity: 0, y: 20 }, enter, 61.0);
    pulse("#c3-st-e", 64.9);

    // c3-8a: blank under member B; the stale panel struck
    fade("#c3-pb", 67.15, 0.4);
    fade("#c3-pb-load", 69.3);
    fade("#c3-pa", 72.0, 0.4);
    tl.fromTo("#c3-a-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 72.9);

    // c3-8b: a table that keeps its last resolved rows
    tl.set(["#c3-pa", "#c3-pb"], { opacity: 0 }, 74.72);
    tl.fromTo("#c3-keep", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 74.72);
    fade("#c3-tag-ls", 78.5);
    fade(["#c3-tag-or", "#c3-tag-rx"], 80.3);

    // c3-9a: which resource
    fade("#c3-which-head", 82.1);
    fade("#c3-w1", 82.6);
    fade("#c3-w2", 84.8);
    fade("#c3-w3", 86.0);

    // c3-9b: writes go through an event handler, then reload; time stays in RxJS
    fade(["#c3-not-head", "#c3-not-1"], 90.05);
    fade("#c3-not-2", 90.6);
    fade("#c3-f1", 93.3, 0.4);
    draw("#c3-e1", 93.8);
    fade("#c3-f2", 94.2, 0.4);
    draw("#c3-e2", 94.9);
    fade("#c3-f3", 95.3, 0.4);

    // questions card: one by one, 0.6 s apart, then hold
    ["#c3-q1", "#c3-q2", "#c3-q3", "#c3-q4"].forEach((q, i) => fade(q, 98.7 + i * 0.6));

    // pause card
    fade("#c3-pause-1", 118.83);
    tl.fromTo("#c3-pause-2", { opacity: 0, y: 16 }, enter, 119.33);

    window.__timelines["c3"] = tl;
  </script>
</template>
