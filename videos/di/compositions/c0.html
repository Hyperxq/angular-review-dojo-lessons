        <div id="c0-g1" class="c0-row">A crash on first use, in your app or in a consumer's, is loud. Someone will notice before users do, or users will hit it at once. It blocks, because the feature does not work.</div>
        <div id="c0-g2" class="c0-row">A silently wrong instance (two objects where everyone expects one, or one where everyone expects their own) is worse than a crash, because nobody notices. Data goes to a place nobody reads, or appears where it does not belong. It blocks as soon as users can see the consequence.</div>
