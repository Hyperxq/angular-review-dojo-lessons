  <script>
    const tl = gsap.timeline({ paused: true });
    const fadeIn = (sel, at, d = 0.5) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d, ease: "power3.out" }, at);
    const print = (sel, at) =>
      tl.fromTo(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.27, ease: "power3.out" }, at);
    const pulse = (sel, at) =>
      tl.to(sel, { scale: 1.12, duration: 0.2, ease: "power2.inOut", yoyo: true, repeat: 1 }, at);
    const draw = (sel, at, d = 0.4) => {
      tl.fromTo(sel + " path", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, at);
      tl.fromTo(sel + " polygon", { opacity: 0 }, { opacity: 1, duration: 0.12 }, at + d - 0.08);
    };
    const line = (sel, at, d = 0.4) =>
      tl.fromTo(sel, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, at);
    const bandIn = (sel, line, at, lines = 1, lh = 51) =>
      tl.fromTo(sel, { opacity: 0, y: line * lh, scaleY: lines, transformOrigin: "50% 0%" }, { opacity: 1, duration: 0.3 }, at);
    const bandTo = (sel, line, at, lines = 1, lh = 51) =>
      tl.to(sel, { y: line * lh, scaleY: lines, transformOrigin: "50% 0%", duration: 0.8, ease: "power2.inOut" }, at);
    const dim = (sels, at, to = 0.25) => tl.to(sels, { opacity: to, duration: 0.4, ease: "power2.inOut" }, at);

    // chapter card: on screen from frame 0, no entrance

    // c2-1: rows arrive at the returns desk; each one costs a catalog call
    fadeIn(".c2-rhead", 3.1, 0.4);
    fadeIn("#c2-cat", 3.3, 0.4);
    for (let i = 1; i <= 6; i++) fadeIn("#c2-rr" + i, 4.6 + (i - 1) * 0.55, 0.4);
    for (let i = 1; i <= 6; i++) tl.set("#c2-calls", { textContent: "calls: " + i }, 9.6 + (i - 1) * 0.35);

    // c2-2: the two parties, the registration, then the four arrows
    fadeIn("#c2-fc", 12.8, 0.5);
    fadeIn("#c2-acc", 12.95, 0.5);
    fadeIn("#c2-ng", 15.6, 0.5);
    ["#c2-a1", "#c2-a2", "#c2-a3", "#c2-a4"].forEach((a, i) => {
      draw(a, 18.2 + i * 0.45, 0.4);
      fadeIn("#c2-l" + (i + 1), 18.35 + i * 0.45, 0.4);
    });
    // c2-3: writeValue first, then the two callbacks the register methods hand over
    dim(["#c2-a2", "#c2-a3", "#c2-a4", "#c2-l2", "#c2-l3", "#c2-l4"], 22.8);
    tl.to(["#c2-a2", "#c2-a3", "#c2-l2", "#c2-l3"], { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 27.4);
    fadeIn("#c2-reg1", 27.6, 0.4);
    fadeIn("#c2-reg2", 27.75, 0.4);
    dim(["#c2-a1", "#c2-l1"], 27.4);
    // c2-4: setDisabledState becomes the accent; it is optional
    dim(["#c2-a2", "#c2-a3", "#c2-l2", "#c2-l3", "#c2-reg1", "#c2-reg2"], 33.2);
    tl.to(["#c2-a4", "#c2-l4"], { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 33.3);
    tl.to("#c2-a4 path", { stroke: "#b8321f", duration: 0.3 }, 33.4);
    tl.to("#c2-a4 polygon", { fill: "#b8321f", duration: 0.3 }, 33.4);
    tl.to("#c2-l4", { color: "#b8321f", duration: 0.3 }, 33.4);
    fadeIn("#c2-opt", 35.6, 0.4);

    // c2-5: band on rate, then the display update, then telling the form
    bandIn("#c2-band1", 7, 45.9, 4);
    bandTo("#c2-band1", 8, 47.3);
    bandTo("#c2-band1", 9, 48.6);

    // c2-6: rows, then marbles printed at 0.18 s per frame; the notes
    ["#c2-row1", "#c2-row2", "#c2-row3", "#c2-row4"].forEach((r, i) => fadeIn(r + " .mlabel, " + r + " .mtrack", 53.8 + i * 0.12, 0.4));
    tl.set(["#c2-n1", "#c2-n2"], { opacity: 0 }, 53.62);
    print("#c2-ma", 55.2);
    print("#c2-mb", 55.74);
    print("#c2-xa", 55.74);
    print("#c2-mc", 56.28);
    print("#c2-xb", 56.28);
    print("#c2-mr", 57.54);
    print("#c2-md", 57.72);
    fadeIn("#c2-n1", 61.6, 0.4);
    fadeIn("#c2-n2", 61.9, 0.4);
    // c2-7: the two checks whose requests already left
    fadeIn("#c2-rb", 64.5, 0.5);
    fadeIn("#c2-sent1", 67.5, 0.4);
    fadeIn("#c2-sent2", 67.8, 0.4);

    // c2-8: a source with no end; forkJoin waits; status stays PENDING
    fadeIn("#c2-src-l", 71.7, 0.4);
    fadeIn("#c2-src-t", 71.8, 0.4);
    print("#c2-d1", 72.4);
    print("#c2-d2", 72.58);
    print("#c2-d3", 72.76);
    fadeIn("#c2-src-tail", 73.2, 0.6);
    draw("#c2-fe", 75.8, 0.3);
    fadeIn("#c2-fj", 76.0, 0.4);
    fadeIn("#c2-fj-note", 76.6, 0.4);
    fadeIn("#c2-st-l", 79.2, 0.4);
    fadeIn("#c2-st", 79.35, 0.4);

    // c2-9: band on updateOn: 'blur'
    bandIn("#c2-band2", 3, 85.4);

    // c2-10: status marbles printed by frame; the pending window banded
    ["#c2-s0", "#c2-v0", "#c2-i0", "#c2-p0"].forEach((m) => print(m, 93.0));
    ["#c2-s3", "#c2-v3", "#c2-i3", "#c2-p3"].forEach((m) => print(m, 93.54));
    ["#c2-s10", "#c2-v10", "#c2-i10", "#c2-p10"].forEach((m) => print(m, 94.8));
    fadeIn("#c2-pband", 95.2, 0.5);
    pulse(["#c2-v3", "#c2-i3"], 97.4);
    tl.to(["#c2-v3", "#c2-i3"], { boxShadow: "0 0 0 6px #b8321f", duration: 0.3 }, 97.4);

    // c2-10b: the two getters a guard can pick, and the open question
    fadeIn("#c2-rows2", 99.9, 0.4);
    fadeIn("#c2-win", 102.2, 0.4);
    fadeIn("#c2-ask", 105.4, 0.4);

    // c2-11: the tree by level; dates, then books, become hot
    fadeIn("#c2-t-loan", 109.4, 0.4);
    line("#c2-te1", 109.7, 0.4);
    line("#c2-te2", 109.7, 0.4);
    fadeIn(["#c2-t-dates", "#c2-t-books"], 109.95, 0.4);
    ["#c2-te3", "#c2-te4", "#c2-te5"].forEach((e) => line(e, 110.25, 0.4));
    fadeIn(["#c2-t-pickup", "#c2-t-due", "#c2-t-0"], 110.5, 0.4);
    ["#c2-te6", "#c2-te7"].forEach((e) => line(e, 110.8, 0.4));
    fadeIn(["#c2-t-isbn", "#c2-t-rating"], 111.05, 0.4);
    tl.to("#c2-t-dates", { borderColor: "#b8321f", duration: 0.3 }, 112.2);
    tl.to("#c2-t-books", { borderColor: "#b8321f", duration: 0.3 }, 113.4);

    // c2-11b: band on the typed getRawValue() line
    bandIn("#c2-band3", 1, 118.2, 2, 45);

    // c2-11c: the group carries the error; due stays as it is
    fadeIn("#c2-h-dates", 122.6, 0.4);
    line("#c2-he1", 122.9, 0.4);
    line("#c2-he2", 122.9, 0.4);
    fadeIn(["#c2-h-pickup", "#c2-h-due"], 123.15, 0.4);
    tl.to("#c2-h-dates", { borderColor: "#b8321f", duration: 0.3 }, 123.6);
    print("#c2-err", 123.8);

    // questions 0.6 s apart, then hold; pause card
    ["#c2-q1", "#c2-q2", "#c2-q3", "#c2-q4", "#c2-q5"].forEach((q, i) => fadeIn(q, 128.45 + i * 0.6));
    fadeIn("#c2-pause-2", 154.35);

    window.__timelines["c2"] = tl;
  </script>
