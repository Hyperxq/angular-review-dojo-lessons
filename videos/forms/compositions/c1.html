    const tl = gsap.timeline({ paused: true });
    const fadeIn = (sel, at, d = 0.5) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d, ease: "power3.out" }, at);
    const draw = (sel, len, at, d = 0.5) =>
      tl.fromTo(sel, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, at);

    // chapter card: on screen from frame 0

    // c1-1: the queue forms beside the renewal form on "a queue behind them"
    for (let i = 1; i <= 4; i++) fadeIn("#c1-qr" + i, 6.6 + (i - 1) * 0.15, 0.4);

    // c1-2: the closed screen, then the record days later; the unknown row last
    fadeIn("#c1-rec", 14.4, 0.6);
    fadeIn("#c1-q-mark", 19.2, 0.4);

    // c1-3: value on "value holds", getRawValue on "get Raw Value"
    fadeIn("#c1-acc-h", 21.1, 0.4);
    fadeIn("#c1-acc-1", 25.1);
    fadeIn("#c1-acc-2", 28.9);

    // c1-4: code cut in whole; the band on the two result lines on "drops out of value"
    tl.fromTo("#c1-band", { opacity: 0, y: 5 * 51 }, { opacity: 1, duration: 0.3 }, 39.4);

    // c1-5: the partial type, then the untyped form and the log far from the desk
    fadeIn("#c1-type", 43.4, 0.5);
    fadeIn("#c1-type-note", 46.4, 0.4);
    fadeIn("#c1-untyped", 49.0, 0.4);
    fadeIn("#c1-log", 50.0, 0.5);
    fadeIn("#c1-logerr", 50.6, 0.3);

    // c1-6: the server already knows the card; sending it back is struck through
    fadeIn("#c1-url", 59.0, 0.4);
    fadeIn("#c1-session", 59.15, 0.4);
    fadeIn("#c1-known", 59.5, 0.4);
    draw("#c1-send", 612, 60.8, 0.5);
    fadeIn("#c1-send-head", 61.25, 0.1);
    fadeIn("#c1-send-lbl", 61.0, 0.4);
    draw("#c1-strike", 586, 62.2, 0.35);

    // c1-7: the disabled column on "A disabled control", then the readonly column
    fadeIn(".c1-d", 66.6, 0.4);
    fadeIn(".c1-r", 70.0, 0.4);

    // c1-8: band on the Checks column; c1-8b: band moves to Note, then null means valid
    fadeIn("#c1-vband", 75.4, 0.3);
    tl.to("#c1-vband", { x: 600, duration: 0.8, ease: "power2.inOut" }, 85.2);
    fadeIn("#c1-null-v", 88.0, 0.3);
    fadeIn("#c1-null-arrow", 88.15, 0.3);
    fadeIn("#c1-null-valid", 88.4, 0.4);

    // c1-9: the interaction states, then the tree with years banded
    fadeIn("#c1-root", 97.1, 0.4);
    fadeIn("#c1-edges", 97.35, 0.4);
    fadeIn("#c1-cardnum", 97.5, 0.4);
    fadeIn("#c1-years", 97.65, 0.4);
    tl.to("#c1-years", { borderColor: "#b8321f", backgroundColor: "#f5e2d9", duration: 0.3 }, 99.5);

    // c1-10: band on markAllAsTouched(), then a form opened red on "Call it on load"
    tl.fromTo("#c1-band2", { opacity: 0, y: 51 }, { opacity: 1, duration: 0.3 }, 102.6);
    fadeIn("#c1-red", 108.2, 0.4);
    fadeIn("#c1-onload", 108.5, 0.4);

    // questions 0.6 s apart, then hold; pause card
    for (let i = 1; i <= 4; i++) fadeIn("#c1-q" + i, 111.45 + (i - 1) * 0.6);
    fadeIn("#c1-pause-2", 133.75);

    window.__timelines["c1"] = tl;
  </script>
</template>
