      <div id="c0-before-sub">Three cheaper answers come first.</div>
      <div class="c0-list c0-prose" style="top: 250px" data-hold>
        <div id="c0-b1" class="c0-row">Plain HTML and CSS. A <code id="c0-u1" class="c0-ul">[class.on-loan]</code> binding in the template, the <code id="c0-u2" class="c0-ul">title</code> attribute, the <code id="c0-u3" class="c0-ul">popover</code> attribute, <span id="c0-u4" class="c0-ul">CSS anchor positioning</span> and the <span id="c0-u5" class="c0-ul">native <code>&lt;dialog&gt;</code> element</span> with <code>showModal()</code> and <code>inert</code> cover a lot of what used to need a directive.</div>
        <div id="c0-b2" class="c0-row">A component, when you need to own a template. An attribute directive adds behaviour to an element the consumer owns. A component owns its markup. If you are building DOM by hand inside a directive, you probably wanted a component.</div>
        <div id="c0-b3" class="c0-row">The Angular CDK, for problems that are hard to get right: overlays (<code>Overlay</code>, <code>CdkConnectedOverlay</code>), focus trapping (<code>cdkTrapFocus</code>), dialogs (CDK <code>Dialog</code>) and screen reader announcements (<code>LiveAnnouncer</code>).</div>
      </div>
      <div id="c0-before-last"><span id="c0-last-ul" class="c0-ul">Write your own directive when the behaviour is specific to your domain, small, and attached to elements you do not control.</span></div>

<span class="ln">@Directive({ selector: <span class="s">'[appShelfLabel]'</span> })</span>
<span class="ln"><span class="k">export class</span> ShelfLabel {</span>
<span id="c0-l-code" class="ln">  <span class="k">readonly</span> code = <span id="c0-tok" class="c0-mk">input.required&lt;string&gt;</span>({ alias: <span class="s">'appShelfLabel'</span> }); <span class="c">// InputSignal&lt;string&gt;</span></span>
<span class="ln">  <span class="k">readonly</span> tint = input(<span class="s">'#e8e0d0'</span>);                                   <span id="c0-opt" class="c c0-ul">// optional, with a default</span></span>
<span class="ln">  <span class="k">readonly</span> picked = output&lt;string&gt;();                                 <span class="c">// OutputEmitterRef&lt;string&gt;</span></span>
<span class="ln">  <span class="k">readonly</span> expanded = model(<span class="k">false</span>);                                   <span class="c">// two-way: [(expanded)]</span></span>
<span class="ln">}</span>
      </div>
      <div id="c0-call">this.code()</div>
      <div id="c0-ng0950">NG0950</div>
      <div id="c0-shelf-para" class="c0-prose">You read a signal input by calling it: <code>this.code()</code>. Inputs are set after the constructor, while the parent renders. In the constructor an optional input returns its default and a required one throws (<code>NG0950</code>). Read inputs only in <span id="c0-m-reactive" class="c0-mk">reactive contexts</span> (a template, a host binding, a <code>computed</code>, an <code>effect</code>), or <span id="c0-m-oneoff" class="c0-mk">from <code>ngOnInit</code> onward for a one-off read</span>. Reactive readers follow every later change of the binding; a one-off read gets the value of that moment only.</div>
    </div>

        <div id="c0-r1" class="c0-row"><code>afterNextRender(fn)</code> runs once, after the next render, in the browser only. It is the place for code that needs the element in the DOM or needs browser APIs. <code>afterEveryRender</code> (called <code>afterRender</code> before v20) runs after every render.</div>

      <div id="c0-zone-para" class="c0-prose" data-hold>Zoneless is the default since v21, and Zone.js is not installed here. Angular renders again when it is told something changed: a signal read by a template changes, a template or host event fires, <code>markForCheck()</code> is called (the <code>async</code> pipe calls it for you), <code>ComponentRef.setInput()</code> runs, or a view is attached. <span id="c0-m-native" class="c0-mk">A directive that writes to <code>nativeElement</code> in its own code is doing work Angular does not track.</span> <span id="c0-m-zone" class="c0-mk">That was true in v17 as well: Zone triggered change detection, but it never re-ran a write you made once in <code>ngOnInit</code>.</span> When a value should follow an input, bind it through <code>host</code>.</div>
