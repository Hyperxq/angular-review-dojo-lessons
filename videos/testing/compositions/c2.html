    const enter = (sel, at) => tl.fromTo(sel, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, at);
    const box = (sel, at) => tl.fromTo(sel, { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, at);
    const draw = (sel, len, at, d = 0.5) =>
      tl.fromTo(sel, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, at);
    const grow = (sel, axis, at) =>
      tl.fromTo(sel, { [axis]: 0, opacity: 1 }, { [axis]: 1, opacity: 1, duration: 0.5, ease: "power2.inOut" }, at);

    // chapter card: on screen from frame 0, time label static

    // c2-1: the due today label, then the catalog search box
    tl.to("#c2-due", { color: "#1d1b18", borderColor: "#1d1b18", duration: 0.3 }, 6.3);
    tl.to("#c2-search", { borderColor: "#1d1b18", color: "#1d1b18", duration: 0.3 }, 7.7);

    // c2-2: three seams, one at a time, each as it is named
    tl.set("#c2-s1", { transformOrigin: "50% 0%" }, 0);
    tl.set(["#c2-s2", "#c2-s3"], { transformOrigin: "0% 50%" }, 0);
    grow("#c2-s1", "scaleY", 15.0);
    fadeIn("#c2-s1l", 15.15, 0.4);
    grow("#c2-s2", "scaleX", 15.8);
    fadeIn("#c2-s2t", 15.95, 0.4);
    grow("#c2-s3", "scaleX", 17.6);
    fadeIn("#c2-s3l", 17.75, 0.4);

    // c2-3: rows one by one, then the "What it does" column banded
    fadeIn("#c2-dh", 19.5, 0.4);
    for (let i = 1; i <= 5; i++) fadeIn("#c2-d" + i, 20.8 + (i - 1) * 0.45, 0.4);
    fadeIn("#c2-colband", 24.4, 0.4);

    // c2-4: the due today label as the accent, then its new Date()
    tl.to("#c2-today", { color: "#b8321f", borderColor: "#b8321f", backgroundColor: "#f5e2d9", duration: 0.3 }, 32.7);
    fadeIn("#c2-newdate", 34.3, 0.5);

    // c2-5: band on inject(CLOCK), then on the useValue line
    fadeIn("#c2-band", 37.6, 0.3);
    tl.to("#c2-band", { y: 4 * 45, duration: 0.8, ease: "power2.inOut" }, 40.8);

    // c2-6: both columns from the cut; the stub under solitary, the note, then the real store under sociable
    box("#c2-sol-box", 45.5);
    fadeIn("#c2-sol-n", 47.9, 0.5);
    box("#c2-soc-box", 50.2);

    // c2-7: the plain hand-written box, the two types you don't own, then the strike
    box("#c2-hand", 54.6);
    fadeIn("#c2-http", 56.0, 0.4);
    fadeIn("#c2-router", 57.2, 0.4);
    draw("#c2-strike", 780, 59.2, 0.5);

    // c2-8: the flow, each arrow drawing on as its step is named; HttpTestingController is the accent
    [[64.6, 1], [67.8, 2], [68.9, 3], [71.2, 4], [72.4, 5]].forEach(([at, i]) => {
      draw("#c2-e" + i, i === 4 ? 782 : 362, at, i === 4 ? 0.6 : 0.4);
      fadeIn("#c2-a" + i, at + (i === 4 ? 0.55 : 0.35), 0.1);
      fadeIn("#c2-l" + i, at + 0.15, 0.4);
      if (i < 5) box("#c2-b" + (i + 1), at + (i === 4 ? 0.6 : 0.4));
    });
    box("#c2-b1", 63.2);
    tl.to("#c2-b5", { borderColor: "#b8321f", backgroundColor: "#f5e2d9", color: "#b8321f", duration: 0.3 }, 71.9);

    // c2-9: rows one by one once the controller is named
    fadeIn("#c2-mh", 73.7, 0.4);
    for (let i = 1; i <= 4; i++) fadeIn("#c2-m" + i, 75.5 + (i - 1) * 0.6, 0.4);

    // c2-9b: each row shown as it is named for the same 2.4 s window; the others step back, nothing banded
    const rows = ["#c2-m1", "#c2-m2", "#c2-m3", "#c2-m4"];
    [84.2, 86.7, 90.0, 92.7].forEach((at, i) => {
      const others = rows.filter((_, j) => j !== i);
      tl.to(others, { opacity: 0.3, duration: 0.3, ease: "power2.inOut" }, at);
      tl.to(others, { opacity: 1, duration: 0.3, ease: "power2.inOut" }, at + 2.4);
    });

    // c2-11: the heading loses its text, the selector still matches its box
    tl.to("#c2-titlebox", { borderColor: "#b8321f", duration: 0.3 }, 102.6);
    tl.to("#c2-title-txt", { opacity: 0, duration: 0.4, ease: "power2.in" }, 102.6);

    // c2-12: the heading named Dune, then the button named Reserve
    tl.to("#c2-book-h", { outlineColor: "rgb(184 50 31 / 1)", duration: 0.3 }, 108.2);
    fadeIn("#c2-role1", 108.35, 0.4);
    tl.to("#c2-reserve", { outlineColor: "rgb(184 50 31 / 1)", duration: 0.3 }, 109.8);
    fadeIn("#c2-role2", 109.95, 0.4);

    // c2-12b: the helper is there from the cut; data-testid on "decorative details"
    fadeIn("#c2-testid", 121.7);

    // questions 0.6 s apart, then hold; pause card
    for (let i = 1; i <= 4; i++) fadeIn("#c2-q" + i, 125.7 + (i - 1) * 0.6);
    fadeIn("#c2-pause-2", 145.3);

    window.__timelines["c2"] = tl;
  </script>
</template>
