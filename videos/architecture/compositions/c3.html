      <div id="c3-char" class="c3-chip" style="left: 200px; top: 400px">characterization tests</div>
      <div id="c3-strangler" data-hold>The strangler fig pattern replaces old code gradually. New code grows beside the old, callers move over one by one, and the old code is removed when nothing calls it. It has real tradeoffs you should look for in a review:</div>
      <div id="c3-trade" data-hold>

        <div id="c3-t2" class="c3-item"><b>–</b><span>Something often sits in front of the old code to route calls (a facade or an adapter). Decide how long it may live; a facade without an end date becomes the next legacy layer.</span></div>
        <div id="c3-t3" class="c3-item"><b>–</b><span>The old behaviour may be wrong. Characterization tests pin bugs too, so decide on purpose whether the migration keeps a bug (and fixes it after) or fixes it during (and accepts that the tests change).</span></div>

        <div id="c3-w3" class="c3-item"><b>–</b><span>Not because a file is long. Length is a smoke alarm; the reason to split is several reasons to change.</span></div>

      <div id="c3-sev2" class="c3-para" style="top: 300px" data-hold>A PR that only sits next to an old problem gets a question or a nit at most, because asking a small PR to fix what it did not cause is scope creep.</div>
