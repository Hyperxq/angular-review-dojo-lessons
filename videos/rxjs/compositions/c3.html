    // c3-6: the slider prints at 0.18 s per frame from "slider"; save keeps only the last of the burst
    fade("#c3-deb-head", 41.5);
    [["#c3-sa", 0], ["#c3-sb", 2], ["#c3-sc", 4], ["#c3-sd", 6], ["#c3-vd", 9], ["#c3-se", 15], ["#c3-ve", 18]].forEach(([m, f]) =>
      print(m, 44.4 + f * 0.18),
    );
    pulse("#c3-vd", 47.9);
    fade("#c3-deb-note", 48.4);

    // c3-7: the debounced press answers late; the throttled press answers at once
    tl.fromTo("#c3-btn-a", { scale: 1 }, { scale: 0.94, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.inOut" }, 51.0);
    tl.fromTo("#c3-wait-a", { scaleX: 0 }, { scaleX: 1, duration: 1.9, ease: "none" }, 51.2);
    fade("#c3-fb-a", 53.1, 0.3);
    tl.fromTo("#c3-btn-b", { scale: 1 }, { scale: 0.94, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.inOut" }, 54.7);
    fade("#c3-fb-b", 54.8, 0.2);

    // questions 0.6 s apart, then hold; pause card
    ["#c3-q1", "#c3-q2", "#c3-q3"].forEach((q, i) => fade(q, 57.08 + 0.3 + i * 0.6));
    fade("#c3-pause-2", 75.8);

    window.__timelines["c3"] = tl;
  </script>
</template>
