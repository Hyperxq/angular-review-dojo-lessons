    fadeIn("#c1-order", 10.2, 0.4);

    tl.to(["#c1-a-list", "#c1-a-tot"], { opacity: 0.35, duration: 0.4 }, 16.6);

    tl.to("#c1-tree-a .node", { opacity: 0.15, duration: 0.3, ease: "power2.in" }, 18.1);
    tl.set("#c1-a-row1 .c1-lit", { opacity: 0 }, 18.4);
    tl.to("#c1-tree-a .node", { opacity: 1, duration: 0.4, ease: "power3.out" }, 18.6);

    // c1-3: every view Eager and lit on a tick; then the LoanList subtree goes OnPush and grey

    bandTo("#c1-band1", 1, 42.0);

    fadeIn("#c1-fo", 55.0);
    fadeIn("#c1-fc", 58.3, 0.4);
    draw("#c1-e4", "#c1-e4h", 128, 58.8, 0.4);

    window.__timelines["c1"] = tl;
