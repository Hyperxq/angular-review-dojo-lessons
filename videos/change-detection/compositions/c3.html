  <script>
    const tl = gsap.timeline({ paused: true });
    const fade = (sel, at, d = 0.5) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d, ease: "power3.out" }, at);
    const print = (sel, at) =>
      tl.fromTo(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.27, ease: "power3.out" }, at);
    const pulse = (sel, at) =>
      tl.to(sel, { keyframes: [{ scale: 1.12, duration: 0.15, ease: "power2.out" }, { scale: 1, duration: 0.15, ease: "power2.in" }] }, at);
    const band = (sel, at, on) =>
      tl.fromTo(sel, { backgroundColor: on ? "rgba(245,226,217,0)" : "rgba(245,226,217,1)" },
        { backgroundColor: on ? "rgba(245,226,217,1)" : "rgba(245,226,217,0)", duration: 0.3, immediateRender: on }, at);
    const ticker = (sel, from, to, count, start) => {
      for (let i = 1; i <= count; i++) tl.set(sel, { textContent: String(from + i) }, start + ((to - start) * i) / count);
    };

    // c3-1: the list stands still, returns queue beside it; a click elsewhere jumps it forward
    print("#c3-q1", 8.2);
    print("#c3-q2", 9.0);
    print("#c3-q3", 9.8);
    tl.to("#c3-search", { backgroundColor: "#1d1b18", color: "#f7f4ee", duration: 0.12 }, 11.9);
    tl.to("#c3-search", { backgroundColor: "rgba(0,0,0,0)", color: "#1d1b18", duration: 0.2 }, 12.15);
    tl.set("#c3-r1", { textContent: "Ficciones" }, 12.2);
    tl.set("#c3-r2", { textContent: "Beloved" }, 12.2);
    tl.set("#c3-r3", { textContent: "The Dispossessed" }, 12.2);
    tl.to(".c3-chip", { opacity: 0, duration: 0.2, ease: "power2.in" }, 12.2);

    // c3-2: three opens, two closes; the closed ones keep counting messages
    fade("#c3-w1", 14.0, 0.3);
    tl.to("#c3-w1", { opacity: 0.45, duration: 0.3 }, 14.9);
    fade("#c3-w2", 15.1, 0.3);
    tl.to("#c3-w2", { opacity: 0.45, duration: 0.3 }, 16.0);
    fade("#c3-w3", 16.2, 0.3);
    ticker("#c3-n1", 0, 20.6, 14, 15.0);
    ticker("#c3-n2", 0, 20.6, 11, 16.2);
    ticker("#c3-n3", 0, 20.6, 9, 17.0);

    // c3-3: the callback first, then the zone wrappers, which dissolve into plain calls
    tl.set(["#c3-za1", "#c3-za2", "#c3-zf1", "#c3-zf2", "#c3-zcap"], { opacity: 0 }, 20.96);
    tl.fromTo(["#c3-zr1", "#c3-zr2"], { opacity: 0 }, { opacity: 0.3, duration: 0.5, ease: "power3.out" }, 21.3);
    tl.to("#c3-zr1", { opacity: 1, duration: 0.5, ease: "power3.out" }, 25.4);
    tl.to("#c3-zr2", { opacity: 1, duration: 0.5, ease: "power3.out" }, 27.6);
    fade(["#c3-za1", "#c3-za2"], 29.5, 0.4);
    fade(["#c3-zf1", "#c3-zf2"], 29.65, 0.4);
    fade("#c3-zcap", 29.9, 0.3);

    // c3-4: printed by frame across rows; the screen's b is the late one
    print("#c3-fa", 32.9);
    print("#c3-fb", 33.62);
    print("#c3-k1", 33.98);
    print("#c3-sb", 34.03);
    fade("#c3-kn", 34.2);
    print("#c3-fc", 34.34);
    fade("#c3-sn", 34.6);
    print("#c3-fd", 35.06);
    print("#c3-k2", 35.42);
    print("#c3-sd", 35.47);
    print("#c3-fe", 35.78);
    pulse("#c3-sb", 36.1);

    // c3-5: each binding gets an empty notifier slot
    fade(".c3-bind", 39.0, 0.4);
    fade("#c3-nh", 40.8);
    tl.fromTo(".c3-tag", { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.3, ease: "power3.out" }, 41.1);
    tl.to(".c3-tag", { borderColor: "#b8321f", duration: 0.4 }, 45.4);

    // c3-6: the first write schedules the tick, the rest join it, all fifty become one render

    tl.to("#c3-dots", { x: 760, scale: 0.12, opacity: 0, transformOrigin: "100% 50%", duration: 1.0, ease: "power2.in" }, 52.3);
    fade("#c3-1r", 53.4);
    fade("#c3-work", 55.2);

    // c3-7: the dense row, the edge gate, the thin signal row
    tl.fromTo(".c3-dm", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.27, stagger: 0.18, ease: "power3.out" }, 58.4);

    print("#c3-o2", 62.4);
    print("#c3-o3", 62.9);

    print("#c3-da", 66.3);
    print("#c3-db", 66.84);
    print("#c3-dc", 67.38);

      fade(`#c3-br${i + 1}`, 80.4 + i * 0.4, 0.3);

    tl.to(["#c3-h1", "#c3-h2"], { borderColor: "#b8321f", duration: 0.3 }, 82.8);

    // c3-10: each start gets its stop, then every stop moves right next to its start
    fade(["#c3-hs", "#c3-he"], 87.0);
    [".c3-res", ".c3-pair:not(.c3-stop)", ".c3-link", ".c3-stop"].forEach((sel, k) =>

    tl.to(".c3-link", { scaleX: 0.05, duration: 0.8, ease: "power2.inOut" }, 92.8);

    // c3-11: the waiting test, then the forcing test; both pass
    tl.set(["#c3-tbh", "#c3-tb", "#c3-pa", "#c3-pb", "#c3-never"], { opacity: 0 }, 95.35);
    band("#c3-ws", 97.0, true);
    fade(["#c3-tbh", "#c3-tb"], 99.0);
    band("#c3-ws", 99.6, false);
    band("#c3-dc1", 99.6, true);
    band("#c3-dc2", 99.6, true);
    fade("#c3-pa", 102.6, 0.4);
    fade("#c3-pb", 102.8, 0.4);
    fade("#c3-never", 104.0);

    // questions, 0.6 s apart
    ["#c3-q1", "#c3-q2", "#c3-q3", "#c3-q4", "#c3-q5"].forEach((q, i) => fade(q, 107.2 + i * 0.6));

    // pause
    fade("#c3-pause-2", 129.1);

    // after the lesson: compare, then write the comment
    tl.fromTo("#c3-after-title", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, 132.5);
    fade("#c3-sol", 134.3);
    fade("#c3-comment", 136.2);
    tl.fromTo("#c3-cl1", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, 136.7);
    tl.fromTo("#c3-cl2", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, 137.1);
    fade("#c3-reread", 139.4);

    // close: 18:00, the wall display goes dark, then the lights go down and stay down
    fade("#c3-closed", 142.3);
    tl.to("#c3-wall2", { backgroundColor: "#1d1b18", duration: 0.8, ease: "power2.inOut" }, 144.0);
    tl.fromTo("#c3-lights", { opacity: 0 }, { opacity: 0.62, duration: 2.0, ease: "power2.inOut" }, 144.6);

    window.__timelines["c3"] = tl;
