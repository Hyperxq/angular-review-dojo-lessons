  <script>
    const tl = gsap.timeline({ paused: true });
    const ACCENT = "#b8321f";
    const SOFT = "rgba(245,226,217,1)";
    const CLEAR = "rgba(245,226,217,0)";
    const fadeIn = (sel, at, d = 0.5) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d, ease: "power3.out" }, at);
    const fadeOut = (sel, at, d = 0.4) => tl.to(sel, { opacity: 0, duration: d, ease: "power2.in" }, at);
    const band = (sel, at) => tl.fromTo(sel, { backgroundColor: CLEAR }, { backgroundColor: SOFT, duration: 0.4 }, at);
    const draw = (sel, at, d) => tl.fromTo(sel, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, at);
    const typeLine = (sel, chars, at, d) => tl.fromTo(sel, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: d, ease: "steps(" + chars + ")" }, at);

    // chapter card: on screen from frame 0, no entrance

    // c2-1: the shelf map, then the shelves fill up
    fadeIn("#c2-map .label", 3.1, 0.5);
    ["#c2-sp1", "#c2-sp2", "#c2-sp3", "#c2-sp4", "#c2-sp5", "#c2-sp6"].forEach((s, i) => fadeIn(s + " i", 4.2 + i * 0.15, 0.6));

    fadeIn("#c2-ref-c", 11.9, 0.5);
    fadeIn("#c2-ref-ne", 16.3, 0.5);
    tl.to("#c2-ref-ne", { borderColor: ACCENT, color: ACCENT, duration: 0.3 }, 16.5);

    fadeIn("#c2-p0", 20.4, 0.5);
    fadeIn("#c2-p1, #c2-p2, #c2-p3, #c2-p-edges", 20.7, 0.5);
    fadeIn("#c2-p4", 22.6, 0.5);
    draw("#c2-p-climb", 25.0, 0.8);
    tl.to("#c2-p1", { borderColor: ACCENT, duration: 0.3 }, 25.7);

    // c2-4: the first group as each is named; the second group, the accent
    fadeIn("#c2-g1h", 27.7, 0.4);
    fadeIn("#c2-o1", 27.7, 0.4);
    fadeIn("#c2-o2", 28.0, 0.4);
    fadeIn("#c2-o3", 28.3, 0.4);
    fadeIn("#c2-o4", 28.9, 0.4);
    fadeIn("#c2-g2h", 31.0, 0.4);
    fadeIn("#c2-o5", 31.05, 0.4);
    fadeIn("#c2-o6", 31.4, 0.4);

    fadeIn("#c2-norm-h", 37.0, 0.5);
    fadeIn("#c2-copy1", 41.1, 0.5);
    fadeIn("#c2-copy2", 41.25, 0.5);
    tl.fromTo("#c2-t1new", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 44.3);
    fadeOut("#c2-t1old", 44.3, 0.4);
    fadeIn("#c2-stale", 46.0, 0.4);
    tl.to("#c2-copy2", { borderColor: ACCENT, duration: 0.3 }, 46.0);

    // c2-7: the normalized tree, the view that joins, then the lookup banded
    fadeIn("#c2-j0, #c2-j1, #c2-j2, #c2-j3, #c2-j-edges", 47.55, 0.5);
    fadeIn("#c2-jcode", 51.6, 0.5);
    band("#c2-jband", 53.4);

    fadeIn("#c2-em", 58.0, 0.4);
    fadeIn("#c2-el", 59.4, 0.4);
    ["#c2-e1", "#c2-e2", "#c2-e3", "#c2-e4", "#c2-e5"].forEach((e, i) => fadeIn(e, 61.6 + i * 0.15, 0.4));

    // c2-9: the receipt, its title kept as it was
    fadeIn("#c2-receipt", 64.9, 0.5);
    band("#c2-rbook", 69.8);

    // c2-10: the heading, then the first attempt typed in
    fadeIn("#c2-reset-h", 74.8, 0.5);
    fadeIn("#c2-rcode", 80.2, 0.3);
    typeLine("#c2-r1", 14, 80.4, 0.4);

    typeLine("#c2-r3", 40, 81.7, 0.8);
    typeLine("#c2-r4", 3, 82.55, 0.2);

    fadeIn("#c2-f1, #c2-f2, #c2-f3, #c2-f4, #c2-f5", 84.5, 0.5);
    [["#c2-a1", "#c2-h1", "#c2-l1", 85.6], ["#c2-a2", "#c2-h2", "#c2-l2", 87.3], ["#c2-a3", "#c2-h3", "#c2-l3", 88.9], ["#c2-a4", "#c2-h4", "#c2-l4", 90.6]].forEach(([a, h, l, at]) => {
      draw(a, at, 0.6);
      fadeIn(h, at + 0.5, 0.2);
      fadeIn(l, at + 0.15, 0.4);

    // c2-12: the window between the first two writes
    tl.to("#c2-a1, #c2-h1, #c2-a2, #c2-h2", { stroke: ACCENT, duration: 0.3 }, 92.1);
    tl.to("#c2-l1, #c2-l2", { color: ACCENT, duration: 0.3 }, 92.1);

    // c2-14, c2-15, c2-16: cut in whole
