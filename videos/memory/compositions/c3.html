    <audio id="vo-c3-4" class="clip" src="assets/vo/c3-4.wav" data-start="29.54" data-duration="7.531" data-volume="1"></audio>

    <audio id="vo-c3-end" class="clip" src="assets/vo/c3-end.wav" data-start="116.04" data-duration="2.197" data-volume="1"></audio>

    <audio id="vo-c3-afterc" class="clip" src="assets/vo/c3-afterc.wav" data-start="157.96" data-duration="9.557" data-volume="1"></audio>

  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const ACCENT = "#b8321f";
    const SOFT = "rgba(245,226,217,1)";
    const CLEAR = "rgba(245,226,217,0)";
    const fadeIn = (sel, at, d = 0.5) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d, ease: "power3.out" }, at);
    const draw = (sel, at, d = 0.4) => {
      tl.fromTo(sel + " path", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, at);
      tl.fromTo(sel + " polygon", { opacity: 0 }, { opacity: 1, duration: 0.12 }, at + d - 0.08);
    };
    const band = (sel, at) => tl.fromTo(sel, { backgroundColor: CLEAR }, { backgroundColor: SOFT, duration: 0.4 }, at);
    const unband = (sel, at) => tl.to(sel, { backgroundColor: CLEAR, duration: 0.4 }, at);
    const bandTo = (sel, row, h, at, rows = 1) =>
      tl.to(sel, { y: row * h, scaleY: rows, transformOrigin: "50% 0%", duration: 0.8, ease: "power2.inOut" }, at);

    // chapter card: on screen from frame 0, no entrance

    // c3-1: shelf map, statistics, search box as they are named
    fadeIn("#c3-map", 4.6, 0.5);
    ["#c3-st1", "#c3-st2", "#c3-st3"].forEach((s, i) => fadeIn(s, 6.9 + i * 0.15, 0.4));
    fadeIn("#c3-search", 8.0, 0.4);

    // c3-2: the map alone; its three steps
    fadeIn("#c3-framed", 12.6, 0.4);
    fadeIn("#c3-sp1", 15.6, 0.4);
    fadeIn("#c3-sp2", 18.6, 0.4);
    fadeIn("#c3-sp3", 20.4, 0.4);

    // c3-3: rows one by one, every row alike
    fadeIn("#c3-thead span", 22.3, 0.4);
    ["#c3-tr1 span", "#c3-tr2 span", "#c3-tr3 span", "#c3-tr4 span", "#c3-tr5 span"].forEach((r, i) => fadeIn(r, 22.9 + i * 0.6, 0.4));

    // c3-4: band on onCleanup; c3-4b: band to the new BroadcastChannel line
    tl.fromTo("#c3-band1", { opacity: 0, y: 3 * 45 }, { opacity: 1, duration: 0.3 }, 32.4);
    bandTo("#c3-band1", 1, 45, 37.6);

    // c3-5: the flow draws on step by step; c3-6: the long task is the accent
    fadeIn("#c3-flow .c3-h", 43.1, 0.4);
    fadeIn("#c3-b4", 44.2, 0.4);
    fadeIn("#c3-b1", 47.4, 0.4);
    draw("#c3-e1", 48.3, 0.3);
    fadeIn("#c3-l1", 48.4, 0.4);
    fadeIn("#c3-b2", 48.6, 0.4);
    draw("#c3-e2", 49.4, 0.3);
    fadeIn("#c3-l2", 49.5, 0.4);
    fadeIn("#c3-b3", 49.7, 0.4);
    draw("#c3-e3", 50.4, 0.5);
    fadeIn("#c3-l3", 50.6, 0.4);
    draw("#c3-e4", 51.5, 0.3);
    fadeIn("#c3-l4", 51.6, 0.4);
    fadeIn("#c3-b5", 51.8, 0.4);
    tl.to("#c3-b5", { borderColor: ACCENT, color: ACCENT, duration: 0.3 }, 57.6);

    // c3-6: the template method, then its computed version
    tl.set("#c3-cmp", { opacity: 0 }, 59.9);
    fadeIn("#c3-cmp", 60.6, 0.4);
    tl.fromTo("#c3-band2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 61.0);

    // c3-7: a cheap keystroke task; then the 50 ms mark and a task that tops it
    fadeIn("#c3-panel", 67.0, 0.4);
    tl.set(["#c3-task-long", "#c3-tl-long", "#c3-mark", "#c3-mark-l", "#c3-next", "#c3-over", "#c3-tri"], { opacity: 0 }, 66.9);
    tl.fromTo("#c3-task-short", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 67.3);
    fadeIn("#c3-tl-short", 67.5, 0.4);
    fadeIn("#c3-mark", 68.9, 0.3);
    fadeIn("#c3-mark-l", 69.0, 0.4);
    tl.to(["#c3-task-short", "#c3-tl-short"], { opacity: 0, duration: 0.3, ease: "power2.in" }, 69.8);
    tl.set("#c3-task-long", { opacity: 1 }, 70.1);
    tl.fromTo("#c3-task-long", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.8, ease: "power2.inOut" }, 70.1);
    fadeIn("#c3-tl-long", 70.4, 0.4);
    fadeIn("#c3-over", 71.0, 0.3);
    fadeIn("#c3-tri", 71.1, 0.3);
    fadeIn("#c3-next", 71.4, 0.5);

    // c3-8: band on the read; it widens over the write and read pair; back on the read
    tl.fromTo("#c3-band3", { opacity: 0, y: 3 * 42 }, { opacity: 1, duration: 0.3 }, 74.4);
    bandTo("#c3-band3", 2, 42, 79.6, 2);
    bandTo("#c3-band3", 3, 42, 82.6, 1);

    // c3-9: the phases in order; band on write:, then on read:
    ["#c3-ph1", "#c3-ph2", "#c3-ph3", "#c3-ph4"].forEach((p, i) => fadeIn(p, 87.4 + i * 0.3, 0.4));
    tl.fromTo("#c3-band4", { opacity: 0, y: 1 * 45 }, { opacity: 1, duration: 0.3 }, 90.4);
    bandTo("#c3-band4", 4, 45, 92.4);

    // c3-10: once is fine, every render can loop
    band("#c3-n2", 99.6);
    unband("#c3-n2", 101.8);
    band("#c3-n3", 101.85);

    // c3-11: step 2, then step 4; the forced reflow insight named
    fadeIn("#c3-panelsteps .c3-h", 105.35, 0.4);
    fadeIn("#c3-s2", 105.6, 0.4);
    fadeIn("#c3-s4", 108.6, 0.4);
    tl.to("#c3-reflow", { color: ACCENT, duration: 0.3 }, 113.5);

    // questions 0.6 s apart, then hold; pause card
    ["#c3-q1", "#c3-q2", "#c3-q3", "#c3-q4", "#c3-q5"].forEach((q, i) => fadeIn(q, 116.3 + i * 0.6));
    fadeIn("#c3-pause-2", 141.9);

    // after the lesson: compare and measure; then the last sentence banded
    fadeIn("#c3-after-title", 145.0, 0.4);
    fadeIn("#c3-a1", 145.4, 0.4);
    fadeIn("#c3-a2", 148.9, 0.4);
    tl.set("#c3-a3", { opacity: 0 }, 144.94);
    fadeIn("#c3-a3", 154.85, 0.4);
    band("#c3-a3", 154.9);

    // c3-afterc: the optional chaining, then the rule
    tl.fromTo("#c3-opt", { backgroundColor: CLEAR }, { backgroundColor: SOFT, color: ACCENT, duration: 0.3 }, 162.6);
    tl.to("#c3-opt", { backgroundColor: CLEAR, color: "#1d1b18", duration: 0.3 }, 165.4);
    band("#c3-last", 165.45);

    // close: 18:00, the lights go down and stay down to the last frame
    fadeIn("#c3-closed", 168.1);
    tl.fromTo("#c3-lights", { opacity: 0 }, { opacity: 0.62, duration: 2.6, ease: "power2.inOut" }, 169.6);

    window.__timelines["c3"] = tl;
  </script>
