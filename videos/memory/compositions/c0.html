        <div class="c0-item"><div id="c0-m1" class="c0-mark"></div>Zone.js is gone (zoneless is the default since v21, and it is not installed here). Zone used to wrap every listener and timer. That never prevented leaks, and its absence does not cause them. <span id="c0-b1" class="c0-band">A leaked listener no longer triggers change detection just by firing; it still does if it sets a signal a template reads or calls <code>markForCheck()</code>.</span></div>
